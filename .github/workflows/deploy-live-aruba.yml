name: Deploy Live Timing to Aruba

on:
  push:
    branches:
      - main
    paths:
      - "live.html"
      - "live-refresh-guard.js"
      - ".github/workflows/deploy-live-aruba.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-live-aruba
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Live Timing bundle
        run: |
          mkdir -p deploy
          cp live-refresh-guard.js deploy/live-refresh-guard.js
          python3 - <<'PY'
          from pathlib import Path

          source = Path('live.html').read_text(encoding='utf-8')
          needle = '<script src="/wp-content/plugins/undercut-f1-standings/assets/dashboard.js?v=2.0" defer></script>'
          guard = '<script src="/live-refresh-guard.js?v=2.2" defer></script>'

          if needle not in source:
              raise SystemExit('dashboard.js tag non trovato in live.html')

          # Elimina eventuali versioni precedenti del guard dalla copia da pubblicare.
          import re
          source = re.sub(r'\s*<script src="/live-refresh-guard\.js\?v=[^"]+" defer></script>\s*', '\n    ', source)
          source = source.replace(needle, guard + '\n    ' + needle, 1)

          Path('deploy/live.html').write_text(source, encoding='utf-8')
          PY

      - name: Deploy Live Timing files to website root via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: /www.formulapaddock.it/
          state-name: .ftp-deploy-live-state.json
          exclude: |
            **/.git*
            **/.git*/**
