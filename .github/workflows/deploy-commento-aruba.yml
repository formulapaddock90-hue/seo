name: Deploy commento.php to Aruba

on:
  push:
    branches:
      - main
    paths:
      - "commento.php"
      - ".github/workflows/deploy-commento-aruba.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-commento-aruba
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy commento.php to Aruba via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /www.formulapaddock.it/seo/
          state-name: .ftp-deploy-commento-state.json
          exclude: |
            **
            !commento.php
            .git*
            .git*/**
            **/.ftp-deploy-commento-state.json
