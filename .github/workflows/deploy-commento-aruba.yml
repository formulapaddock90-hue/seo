name: Deploy commento.php to Aruba

on:
  push:
    branches:
      - main
    paths:
      - "commento.php"
      - "drivers.json"
      - ".github/workflows/deploy-commento-aruba.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-commento-aruba
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare commento bundle
        run: |
          mkdir -p deploy
          cp commento.php deploy/commento.php
          cp drivers.json deploy/drivers.json

      - name: Deploy commento bundle to Aruba via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: /www.formulapaddock.it/seo/
          exclude: |
            **/.git*
            **/.git*/**
