name: Deploy API bridge to Aruba

on:
  push:
    branches:
      - main
    paths:
      - "config.php"
      - "conn.php"
      - "auth.php"
      - "login.php"
      - "logout.php"
      - "assets/**"
      - "index.php"
      - "modules/**"
      - "api/**"
      - ".github/workflows/deploy-api-bridge-aruba.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-bridge-aruba
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare complete backend bundle
        run: |
          mkdir -p deploy/api deploy/assets deploy/modules
          cp config.php deploy/config.php
          cp conn.php deploy/conn.php
          cp auth.php deploy/auth.php
          cp login.php deploy/login.php
          cp logout.php deploy/logout.php
          cp index.php deploy/index.php
          cp -R assets/. deploy/assets/
          cp -R modules/. deploy/modules/
          cp -R api/. deploy/api/

      - name: Deploy API bridge to Aruba via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: /www.formulapaddock.it/seo/
          state-name: .ftp-deploy-api-bridge-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/private.php
            **/.env*
            **/credentials/**
            **/output/**
