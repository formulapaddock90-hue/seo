name: Deploy Content Hub bridge to Aruba

on:
  push:
    branches:
      - main
    paths:
      - "index.php"
      - "assets/js/json-import-local.js"
      - "api/index.php"
      - "api/assets/js/json-import-local.js"
      - "api/bootstrap.php"
      - "api/settings.php"
      - "api/live-social-context.php"
      - ".github/workflows/deploy-api-bridge-aruba.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-bridge-aruba
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Content Hub bundle
        run: |
          mkdir -p deploy/api deploy/assets/js deploy/api/assets/js
          cp index.php deploy/index.php
          cp assets/js/json-import-local.js deploy/assets/js/json-import-local.js
          cp api/index.php deploy/api/index.php
          cp api/assets/js/json-import-local.js deploy/api/assets/js/json-import-local.js
          cp api/bootstrap.php deploy/api/bootstrap.php
          cp api/settings.php deploy/api/settings.php
          cp api/live-social-context.php deploy/api/live-social-context.php

      - name: Deploy Content Hub bridge to Aruba via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: /www.formulapaddock.it/seo/
          exclude: |
            **/.git*
            **/.git*/**
            **/config.php
            **/private.php
            **/.env*
