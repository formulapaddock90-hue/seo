name: Deploy API bridge to Aruba

on:
  push:
    branches:
      - main
    paths:
      - "config.php"
      - "api/bootstrap.php"
      - "api/settings.php"
      - "api/live-social-context.php"
      - "api/upload-json.php"
      - "api/api/upload-json.php"
      - ".github/workflows/deploy-api-bridge-aruba.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-bridge-aruba
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare minimal backend bundle
        run: |
          mkdir -p deploy/api deploy/api/api
          cp config.php deploy/config.php
          cp api/bootstrap.php deploy/api/bootstrap.php
          cp api/settings.php deploy/api/settings.php
          cp api/live-social-context.php deploy/api/live-social-context.php
          cp api/upload-json.php deploy/api/upload-json.php
          cp api/api/upload-json.php deploy/api/api/upload-json.php

      - name: Deploy API bridge to Aruba via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: /www.formulapaddock.it/seo/
          exclude: |
            **/.git*
            **/.git*/**
            **/private.php
            **/.env*
