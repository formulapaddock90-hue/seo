name: Fix commento driver field

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix commento driver field') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch commento.php
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('commento.php')
          s = p.read_text(encoding='utf-8')
          old = "        window.openEventModal = function(eventType) {\n            currentEventType = eventType;\n            const modal = document.getElementById('event-input-modal');"
          new = "        window.openEventModal = async function(eventType) {\n            currentEventType = eventType;\n\n            // I piloti vengono caricati via fetch: attendi il caricamento prima di creare il select.\n            if (driversData.length === 0) {\n                await loadDrivers();\n            }\n\n            const modal = document.getElementById('event-input-modal');"
          if old not in s:
              raise SystemExit('Pattern non trovato: commento.php non modificato')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commento.php
          git rm .github/workflows/fix-commento-driver.yml
          git commit -m "Fix commento driver field"
          git push
