name: Patch commento to Live Timing data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-commento-live-api.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect commento.php directly to Formula Paddock Live data
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('commento.php')
          text = path.read_text(encoding='utf-8')

          old = "https://www.formulapaddock.it/wp-json/undercutf1/v1/update-standings"
          new = "https://www.formulapaddock.it/live-data.php?t=' + Date.now()"

          if old in text:
              text = text.replace(
                  "fetch('" + old + "',{cache:'no-store'})",
                  "fetch('" + new + "',{cache:'no-store'})",
                  1
              )
          elif "https://www.formulapaddock.it/live-data.php?t=' + Date.now()" in text:
              print('commento.php è già collegato a live-data.php')
          else:
              raise SystemExit('Endpoint standings attuale non trovato in commento.php')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched commento.php
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commento.php
          if git diff --cached --quiet; then
            echo "Nessuna modifica necessaria"
            exit 0
          fi
          git commit -m "Connect commento to Formula Paddock Live data"
          git push
